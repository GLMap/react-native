apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
group = 'globus'
def packageJson = new groovy.json.JsonSlurper().parse(file('../package.json'))
version = packageJson.version
def sdkDirectory = System.getenv('GLMAP_SDK_DIR')
def sdkVersion = sdkDirectory ? new groovy.json.JsonSlurper().parse(new File(sdkDirectory, 'sdk.json')).version : '2.2.0'
rootProject.allprojects {
  repositories {
    if (sdkDirectory) maven { url new File(sdkDirectory, 'maven').toURI() }
    maven { url 'https://maven.globus.software/artifactory/libs' }
  }
}
android {
  namespace 'software.globus.reactnative.glmap'
  defaultConfig { minSdkVersion 24; versionCode 1; versionName packageJson.version }
  sourceSets { main { assets.srcDirs += '../assets' } }
}
dependencies {
  implementation "globus:glmap:${sdkVersion}"
  api project(":globus-software-glmap-core")
}
