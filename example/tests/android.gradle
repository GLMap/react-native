// Kept outside Expo's generated native project so prebuild preserves UI tests.
android {
    // Release tests exercise the bundled default catalog without a Metro server.
    testBuildType providers.gradleProperty('glmapTestBuildType').getOrElse('debug')
    defaultConfig { testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" }
    sourceSets { androidTest.java.srcDirs += ["../../tests/android"] }
}
dependencies {
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
